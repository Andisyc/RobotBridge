_target_: envs.gmt.GMTEnv
_recursive_: False
config:
  device: ${device}
  simulator: ${sim}
  obs: ${obs}
  control: ${robot.control}
  collect_dataset: False
  motion: ${mimic.motion}
  policy: ${mimic.policy}
  record_motion:
    enabled: False
    output_dir: ./recorded_motions
    prefix: robotbridge
    min_frames: 2
    record_initial_frame: True
    include_incomplete: True
    fps: null
  record_video:
    enabled: False
    output_dir: ./videos
    prefix: robotbridge
    fps: 30
    width: 1280
    height: 720
    render_every: 0
    record_initial_frame: True
    include_incomplete: True
    min_frames: 2
    track_body_name: torso_link
    distance: 3.0
    azimuth: 180.0
    elevation: -12.0
    lookat_height: 0.75
